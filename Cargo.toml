[package]
name = "PreVocal"
version = "0.1.0"
edition = "2024"
authors = ["PreVocal Team <dev@prevocal.example>"]
description = "PreVocal Vocal Bus Preamp with standalone Slint UI and nice-plug plugin targets."
license = "MIT OR Apache-2.0"
repository = "https://example.com/prevocal"
keywords = ["audio", "dsp", "vst3", "clap", "preamp", "slint"]

[lib]
name = "prevocal"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "prevocal-standalone"
path = "src/main.rs"

[features]
default = ["nice-plug/vst3", "nice-plug/tracing-subscriber"]
# Windows-only: enables the ASIO host (ASIO4ALL, Steinberg ASIO, etc.) in the
# standalone. Requires LLVM/Clang + MSVC build tools to compile the ASIO SDK.
asio = ["cpal/asio"]

[dependencies]
nice-plug = { git = "https://codeberg.org/RustAudio/nice-plug", tag = "v0.2.3", default-features = false }
# NOTE: Only FemtoVG is enabled for now — we want everything working on the
# OpenGL renderer alone. Skia (slow builds) and Software are intentionally NOT
# compiled in. If FemtoVG proves unstable, add renderer-winit-software back.
slint = { version = "1.17.1", features = ["renderer-winit-femtovg", "unstable-winit-030"] }
cpal = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "smallvec"] }
chrono = "0.4"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[build-dependencies]
slint-build = "1.17.1"

[dev-dependencies]
asio-sys = "0.3"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
